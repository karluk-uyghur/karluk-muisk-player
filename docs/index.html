<!DOCTYPE html>
<html lang="ug" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قارلۇق نەشىد قويغۇچ — Karluk MP3 Pro</title>
  <style>
    :root {
      --bg1: #040b1f;
      --bg2: #0a2054;
      --accent: #00d4ff;
      --accent2: #1e6bff;
      --card: rgba(20, 43, 99, 0.55);
      --border: rgba(0, 212, 255, 0.35);
      --text: #f4f8ff;
      --muted: #aec2e8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Noto Sans Arabic", sans-serif;
      color: var(--text);
      background: linear-gradient(155deg, var(--bg1), var(--bg2));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 520px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 32px 24px;
      text-align: center;
      backdrop-filter: blur(18px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(0, 212, 255, 0.16);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-weight: 700;
      font-size: 13px;
      margin-bottom: 14px;
    }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { color: var(--muted); line-height: 1.7; margin: 0 0 24px; }
    .btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 16px;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      color: #031126;
      text-decoration: none;
      font-weight: 800;
      font-size: 16px;
      box-shadow: 0 8px 24px rgba(0, 212, 255, 0.35);
    }
    .meta { margin-top: 20px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">v1.2.1 • ئەڭ يېڭى نەشرى</span>
    <h1>قارلۇق نەشىد قويغۇچ (Karluk MP3 Pro)</h1>
    <p>
      ئۇيغۇرچە، ئەرەبچە، تۈركچە ۋە ئىنگلىزچە قوشۇلغان ساپ نەشىد قويغۇچ.
      يېڭىلانغان ئەپ نەشىرلىرى تۆۋەندىكى تېلېگرام قانىلىغا ئېلان قىلىنىدۇ.
    </p>
    <a class="btn" href="https://t.me/aplirim2026" target="_blank" rel="noopener">
      تېلېگرام قانىلىدىن چۈشۈرۈش
    </a>
    <div class="meta">https://t.me/aplirim2026</div>
  </main>
</body>
</html>
